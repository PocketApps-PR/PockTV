# Ajustes de PockTV (formato VARIABLE="valor")

# Palabras (en el group-title de tu lista) para reconocer cada categoria
KW_SERIES="serie novela anime temporada season"
KW_PELIS="peli movie film vod cine pelicula película"

# Botones (joystick SDL). Si A/B no responden bien, abre iptv_ui.log: ahi aparece
# "boton N -> ..." cada vez que presionas uno. Cambia estos numeros.
# SWAP_AB="1" intercambia A/B y X/Y (la Flip los trae asi) si se sienten al reves.
SWAP_AB="1"
BTN_OK="0"
BTN_BACK="1"
BTN_PGUP="4"
BTN_PGDN="5"
# X = marcar/quitar favorito, Y = buscar (suelen ser 2 y 3)
BTN_FAV="2"
BTN_SEARCH="3"

# Tamano de pantalla de la Flip
WIDTH="640"
HEIGHT="480"

# Opciones extra para ffplay (se leen tambien desde aqui)
FFPLAY_EXTRA=""

# Puente https->http (el ffplay de la Flip no trae https). 1 = activado
HTTPS_BRIDGE="1"

# Boton MENU de la consola -> volver al inicio (indice SDL "guide" = 5)
BTN_HOME="5"

# Reproductor interno para peliculas (prueba). "0" = usar ffplay como antes.
PLAYER_INTERNO="1"
# Reproductor interno tambien para TV en vivo (pausa con pantalla propia). "0" = ffplay como antes.
PLAYER_INTERNO_TV="1"
PLAYER_INTERNO_SERIES="1"
